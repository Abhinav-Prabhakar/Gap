[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "gapmcp"
version = "0.1.0"
description = "Typed actions, policy, auth and an MCP server for agents, in Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gap contributors" }]
keywords = ["mcp", "agents", "tools", "policy", "actions", "model-context-protocol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=2.3.0",
  "pydantic>=2.8",
  "PyJWT[crypto]>=2.8",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/gapmcp/gap"
Repository = "https://github.com/gapmcp/gap"

[tool.hatch.build.targets.wheel]
packages = ["src/gapmcp"]

[tool.hatch.build.targets.sdist]
include = ["src/gapmcp", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
filterwarnings = [
  "error::DeprecationWarning:gapmcp.*",
]

[tool.ruff]
line-length = 88
target-version = "py310"
